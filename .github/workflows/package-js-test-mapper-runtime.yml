name: package-js-test-mapper-runtime

on:
  workflow_dispatch:

jobs:
  package-0-1-0-release-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: runtimes/js-test-mapper-runtime/package-lock.json
      - name: Install exact Runtime dependencies
        working-directory: runtimes/js-test-mapper-runtime
        run: npm ci --ignore-scripts --workspaces=false
      - name: Prepare locked browser
        working-directory: runtimes/js-test-mapper-runtime
        run: node node_modules/playwright/cli.js install chromium
      - name: Build and clean-room smoke formal 0.1.0
        working-directory: runtimes/js-test-mapper-runtime
        run: npm run smoke -- build/js-test-mapper-runtime-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-test-mapper-runtime-0.1.0
          path: build/js-test-mapper-runtime-release/*
          if-no-files-found: error
