name: Update Playwright MCP lock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check and update locked version
        id: update
        shell: bash
        run: |
          set -euo pipefail
          MCP_FILE="plugins/reverse-test-workbench/.mcp.json"
          PLUGIN_FILE="plugins/reverse-test-workbench/.codex-plugin/plugin.json"
          LATEST="$(npm view @playwright/mcp version)"
          CURRENT="$(node -e "const c=require('./${MCP_FILE}'); const a=c.mcpServers.playwright.args.find(x=>x.startsWith('@playwright/mcp@')); process.stdout.write(a.split('@').pop())")"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT="$CURRENT" LATEST="$LATEST" MCP_FILE="$MCP_FILE" PLUGIN_FILE="$PLUGIN_FILE" node <<'NODE'
          const fs = require('fs');
          const mcpPath = process.env.MCP_FILE;
          const pluginPath = process.env.PLUGIN_FILE;
          const current = process.env.CURRENT;
          const latest = process.env.LATEST;

          const mcp = JSON.parse(fs.readFileSync(mcpPath, 'utf8'));
          const args = mcp.mcpServers.playwright.args;
          const index = args.findIndex(value => value === `@playwright/mcp@${current}`);
          if (index < 0) throw new Error('Locked Playwright MCP argument not found');
          args[index] = `@playwright/mcp@${latest}`;
          fs.writeFileSync(mcpPath, JSON.stringify(mcp, null, 2) + '\n');

          const plugin = JSON.parse(fs.readFileSync(pluginPath, 'utf8'));
          const baseVersion = plugin.version.split('+', 1)[0];
          const parts = baseVersion.split('.').map(Number);
          if (parts.length !== 3 || parts.some(Number.isNaN)) throw new Error('Plugin version is not strict semver');
          parts[2] += 1;
          plugin.version = parts.join('.');
          fs.writeFileSync(pluginPath, JSON.stringify(plugin, null, 2) + '\n');
          NODE

          npx -y "@playwright/mcp@${LATEST}" --version
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Open update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT: ${{ steps.update.outputs.current }}
          LATEST: ${{ steps.update.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="deps/playwright-mcp-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add plugins/reverse-test-workbench/.mcp.json plugins/reverse-test-workbench/.codex-plugin/plugin.json
          git commit -m "chore: update Playwright MCP to ${LATEST}"
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore: update Playwright MCP to ${LATEST}" \
            --body "Updates the locked official Playwright MCP from ${CURRENT} to ${LATEST}. The workflow verified that the new package starts and reports its version. Review and run the forward UI smoke test before merging."
