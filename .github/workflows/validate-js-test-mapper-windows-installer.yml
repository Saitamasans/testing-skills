name: Validate js-test-mapper Windows installer

on:
  push:
    paths:
      - installers/install-js-test-mapper.cmd
      - tests/test_github_install_launchers.py
      - tooling/sync_branding.py
      - tooling/branding.py
      - config/brand.json
      - .gitattributes
      - .github/workflows/validate-js-test-mapper-windows-installer.yml
  pull_request:
    paths:
      - installers/install-js-test-mapper.cmd
      - tests/test_github_install_launchers.py
      - tooling/sync_branding.py
      - tooling/branding.py
      - config/brand.json
      - .gitattributes
      - .github/workflows/validate-js-test-mapper-windows-installer.yml

permissions:
  contents: read

jobs:
  validate-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check branding bytes
        run: python tooling/sync_branding.py --check
      - name: Execute real Windows CMD installer test
        run: python -m unittest tests.test_github_install_launchers.GitHubInstallLauncherTest.test_js_test_mapper_cmd_executes_with_windows_cmd -v
